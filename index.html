<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width" />
    <link
      href="https://cdn.datatables.net/v/dt/dt-3.0.2/datatables.min.css"
      rel="stylesheet"
      integrity="sha384-mr0ObFSzaij8F1fFA3BsXCL998+r9tYwkJmx/gydwbT8Mq8EeJwBlqWm5uFUrFbu"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.datatables.net/v/dt/dt-3.0.2/datatables.min.js"
      integrity="sha384-S27Gmq+yiALyXvt4WgoOs+8UonZ/LMOqnCNC6xSj1vGgbHxMvcgkFYUHvkSfW5fo"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.8.1/nouislider.min.js"
      integrity="sha512-g/feAizmeiVKSwvfW0Xk3ZHZqv5Zs8PEXEBKzL15pM0SevEvoX8eJ4yFWbqakvRj7vtw1Q97bLzEpG2IVWX0Mg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.8.1/nouislider.css"
      integrity="sha512-MKxcSu/LDtbIYHBNAWUQwfB3iVoG9xeMCm32QV5hZ/9lFaQZJVaXfz9aFa0IZExWzCpm7OWvp9zq9gVip/nLMg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://cdn.datatables.net/responsive/4.0.2/css/responsive.dataTables.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.datatables.net/responsive/4.0.2/js/dataTables.responsive.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <title>Ghost reading list</title>
  </head>
  <body>
    <h1>Ghost reading list</h1>
    <p>This is still a WIP! Minor appearances are not listed yet.</p>
    <p>Recommended rating ranges from no stars to ⭐⭐.</p>
    <search>
      <form id="tag-search-form">
        <label for="tag-search-input">Tag Search:</label>
        <ul class="tag-search-list">
          <li>
            <input
              type="search"
              id="tag-search-input"
              autocomplete="off"
              value=""
            />
          </li>
        </ul>
        <ul class="dropdown"></ul>
      </form>
      <form id="rating-search">
        <span>Rating:</span>
        <div id="rating-search-slider"></div>
      </form>
    </search>
    <table id="example" class="display">
      <thead>
        <tr>
          <th>Title</th>
          <th>Recommended?</th>
          <th>Comments</th>
          <th>Tags</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <footer>
      <p>
        Ghost belongs to Marvel Comics. For any questions or feedback, please
        message me @gxixiz on Tumblr.
      </p>
    </footer>
    <script src="script.js" type="module"></script>
  </body>
</html>
