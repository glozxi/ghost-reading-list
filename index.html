<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width" />
    <link
      href="https://cdn.datatables.net/v/dt/dt-3.0.2/datatables.min.css"
      rel="stylesheet"
      integrity="sha384-mr0ObFSzaij8F1fFA3BsXCL998+r9tYwkJmx/gydwbT8Mq8EeJwBlqWm5uFUrFbu"
      crossorigin="anonymous"
    />

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"
      integrity="sha512-QoJS4DOhdmG8kbbHkxmB/rtPdN62cGWXAdAFWWJPvUFF1/zxcPSdAnn4HhYZSIlVoLVEJ0LesfNlusgm2bPfnA=="
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.datatables.net/v/dt/dt-3.0.2/datatables.min.js"
      integrity="sha384-S27Gmq+yiALyXvt4WgoOs+8UonZ/LMOqnCNC6xSj1vGgbHxMvcgkFYUHvkSfW5fo"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://cdn.datatables.net/responsive/4.0.2/css/responsive.dataTables.min.css"
      rel="stylesheet"
    />

    <script src="https://cdn.datatables.net/responsive/4.0.2/js/dataTables.responsive.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <title>Ghost reading list</title>
  </head>
  <body>
    <h1>Ghost reading list!</h1>
    <p>This is still a WIP! Minor appearances are not listed yet.</p>
    <p>Recommended rating ranges from no stars to ⭐⭐.</p>
    <table id="example" class="display">
      <thead>
        <tr>
          <th>Title</th>
          <th>Recommended?</th>
          <th>Comments</th>
          <th>Tags</th>
        </tr>
      </thead>

      <tfoot>
        <tr>
          <th>Title</th>
          <th>Recommended?</th>
          <th>Comments</th>
          <th>Tags</th>
        </tr>
      </tfoot>
      <tbody></tbody>
    </table>
    <footer>
      <p>
        Ghost belongs to Marvel Comics. For any questions or feedback, please
        message me @gxixiz on Tumblr.
      </p>
    </footer>
    <script>
      function multiSearch(select, column) {
        const selectedValues = [...select.selectedOptions].map(
          (option) => option.value,
        );

        if (selectedValues.length === 0) {
          column.search("").draw();
          return;
        }
        column
          .search((d) => {
            return selectedValues.includes(d);
          })
          .draw();
      }
      const table = new DataTable("#example", {
        ajax: "data.json",
        columns: [
          { data: "title" },
          { data: "recommended" },
          { data: "comments" },
          { data: "tags", render: (data) => data.join("") },
        ],
        responsive: true,
        paging: false,
      });
      table.ready(() => {
        table.columns().every(function () {
          let column = this;

          // Create select element
          let select = document.createElement("select");
          select.setAttribute("multiple", "true");
          select.add(new Option(""));
          column.footer().replaceChildren(select);

          // Apply listener for user change in value
          select.addEventListener("change", () => multiSearch(select, column));

          // Add list of options
          column
            .data()
            .unique()
            .sort()
            .each(function (d, j) {
              select.add(new Option(d));
            });
        });

        // Set dark-mode/light-mode
        let prefers = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        let html = document.querySelector("html");

        html.classList.add(prefers);
      });
    </script>
  </body>
</html>
